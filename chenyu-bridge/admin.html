<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>晨羽桥接 · 控制台</title>
<style>
  :root{
    --bg:#0b0e14; --bg-2:#0f141d; --panel:#131a24; --panel-2:#182231; --panel-3:#1d2838;
    --border:#243043; --border-2:#2c3a4f; --text:#e8eef7; --muted:#8797ad; --faint:#5c6b80;
    --accent:#5b8dff; --accent-2:#7c5cff; --ok:#2ecc71; --warn:#f2b544; --err:#ff5d5d; --cyan:#38d9d0;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --bg-2:#eef1f7; --panel:#ffffff; --panel-2:#f3f6fb; --panel-3:#e9eef6;
    --border:#e2e8f2; --border-2:#d4ddea; --text:#1a2332; --muted:#5d6b80; --faint:#8b9ab0;
    --accent:#2f6bff; --accent-2:#6a4dff; --ok:#12a150; --warn:#b7791f; --err:#e04040; --cyan:#0fa8a0;
    --shadow:0 10px 30px rgba(20,40,80,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(91,141,255,.10),transparent),var(--bg);
    color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;min-height:100vh}
  .side{width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;box-shadow:0 6px 18px rgba(91,141,255,.35)}
  .brand .t{font-weight:700;letter-spacing:.4px;font-size:15px}.brand .s{font-size:11px;color:var(--muted)}
  .nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;transition:.15s}
  .nav a:hover{background:var(--panel-2);color:var(--text)}
  .nav a.active{background:linear-gradient(90deg,rgba(91,141,255,.18),rgba(124,92,255,.06));color:var(--text);box-shadow:inset 0 0 0 1px rgba(91,141,255,.25)}
  .nav a svg{width:17px;height:17px;flex-shrink:0}
  .side .foot{padding:14px 18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}
  .side .foot .row{display:flex;align-items:center;gap:7px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);z-index:20}
  .top h2{font-size:16px;margin:0;font-weight:650}.top .sub{color:var(--muted);font-size:12px}.top .spacer{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)} .dot.err{background:var(--err);box-shadow:0 0 10px var(--err)}
  .content{padding:24px 26px 60px;max-width:1300px;width:100%;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);
    border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  button:hover{border-color:var(--accent);color:var(--text)}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:0 6px 16px rgba(91,141,255,.28)}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent}button.danger:hover{border-color:var(--err);color:var(--err)}
  button.sm{padding:5px 10px;font-size:12px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .card-h h3{margin:0;font-size:13.5px;font-weight:600}.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}
  .sec{margin-bottom:22px}.muted{color:var(--muted)}.faint{color:var(--faint)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(91,141,255,.14),transparent 70%)}
  .kpi .k-label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .kpi .k-val{font-size:26px;font-weight:750;margin-top:8px;letter-spacing:-.5px}
  .kpi .k-sub{color:var(--faint);font-size:11.5px;margin-top:5px}.kpi .ic{position:absolute;right:16px;top:16px;color:var(--faint)}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:var(--bg-2)}
  tbody tr:hover{background:rgba(91,141,255,.05)}tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-ok{color:var(--ok);background:rgba(46,204,113,.12)}.p-warn{color:var(--warn);background:rgba(242,181,68,.12)}
  .p-err{color:var(--err);background:rgba(255,93,93,.12)}.p-muted{color:var(--muted);background:rgba(135,151,173,.12)}
  .p-run{color:var(--accent);background:rgba(91,141,255,.14)}
  .prog{height:8px;border-radius:999px;background:var(--panel-3);overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .4s}
  .bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding:10px 4px 0}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
  .bars .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),rgba(124,92,255,.5));min-height:3px;transition:height .4s}
  .bars .lbl{font-size:10.5px;color:var(--faint)}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:3px}
  .tabs button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--muted)}
  .tabs button.active{background:var(--panel-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  input,select,textarea{font-family:inherit;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:8px 11px;font-size:13px}
  textarea{resize:vertical;min-height:74px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .search{min-width:210px}
  .gpus{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .gpu{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .gpu .name{font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gpu .price{font-size:20px;font-weight:750;margin-top:12px}.gpu .price small{font-size:11px;color:var(--faint);font-weight:500}
  .gpu .meta{color:var(--faint);font-size:11.5px;margin-top:6px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}
  .field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12.5px;color:var(--muted)}
  .field .hint{font-size:11px;color:var(--faint);line-height:1.5}.field input,.field select{width:100%}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding-top:4px;flex-wrap:wrap}
  .info-list{padding:16px 18px;display:grid;gap:11px}
  .info-list .r{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .info-list .r span:first-child{color:var(--muted);flex-shrink:0}.info-list .r b{font-weight:600;text-align:right;word-break:break-all}
  .logbox{max-height:560px;overflow:auto;padding:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .logline{display:flex;gap:12px;padding:3px 18px;white-space:pre-wrap;word-break:break-all}
  .logline:hover{background:rgba(127,127,127,.06)}.logline .tm{color:var(--faint);flex-shrink:0}.logline .lv{flex-shrink:0;width:48px;font-weight:700}
  .lv.info{color:var(--accent)}.lv.warn{color:var(--warn)}.lv.error{color:var(--err)}
  .empty{padding:42px 16px;text-align:center;color:var(--muted)}.empty svg{opacity:.4;margin-bottom:10px}
  .thumb{width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
  .mask{position:fixed;inset:0;background:rgba(4,7,12,.6);display:none;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(2px)}
  .mask.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border-2);border-radius:16px;padding:22px;width:440px;max-width:94vw;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
  .modal.wide{width:640px}.modal h3{margin:0 0 10px;font-size:16px}
  .modal p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel-2);
    border:1px solid var(--border-2);padding:10px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.25s;z-index:90;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{border-color:var(--err);color:var(--err)}
  .modal pre{background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:11px;font-size:12px;overflow:auto;max-height:240px;white-space:pre-wrap;word-break:break-all}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:13px}.kv .k{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:12px}
  .chip button{border:none;background:transparent;padding:0;color:var(--muted);font-size:11px}
  .chip button:hover{color:var(--accent)}
  .toggle{position:relative;display:inline-block;width:40px;height:22px}
  .toggle input{display:none}.toggle .sl{position:absolute;inset:0;background:var(--panel-3);border:1px solid var(--border-2);border-radius:999px;transition:.2s}
  .toggle .sl::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}
  .toggle input:checked + .sl{background:rgba(46,204,113,.25);border-color:var(--ok)}.toggle input:checked + .sl::before{transform:translateX(18px);background:var(--ok)}
  .rowflex{display:flex;align-items:center;gap:10px}
  @media(max-width:820px){.side{width:62px}.brand .t,.brand .s,.nav a .lbl,.side .foot{display:none}.nav a{justify-content:center}.content{padding:18px 14px 50px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">CY</div><div><div class="t">晨羽桥接</div><div class="s">Chenyu Bridge</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="row"><span class="dot" id="connDot"></span><span id="connText">连接中…</span></div><div style="margin-top:6px" id="verText"></div></div>
  </aside>
  <div class="main">
    <div class="top">
      <h2 id="pageTitle">概览</h2><span class="sub" id="pageSub"></span>
      <div class="spacer"></div>
      <span class="muted" id="lastUpdated" style="font-size:12px"></span>
      <button class="ghost sm" id="btnTheme" title="切换主题">◐</button>
      <button class="ghost sm" id="btnRefresh">刷新</button>
      <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="auto" checked /> 自动</label>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="mask" id="authMask"><div class="modal">
  <h3>需要管理口令</h3>
  <p>请输入环境变量 <b>BRIDGE_ADMIN_TOKEN</b>（或后台设置的口令）以进入控制台。</p>
  <input id="tokenInput" type="password" placeholder="管理口令" style="width:100%;margin-bottom:16px" />
  <div class="acts"><button class="primary" onclick="saveToken()">进入</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const ICONS={
 overview:'<path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-18v6h8V3h-8z"/>',
 instances:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="1"/><circle cx="7" cy="17" r="1"/>',
 tasks:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
 models:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/>',
 gpus:'<rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9" y="9" width="6" height="6"/><path d="M2 9h2M2 14h2M20 9h2M20 14h2M9 2v2M14 2v2M9 20v2M14 20v2"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
 api:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
 logs:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
};
function icon(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function iconF(n){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">'+(ICONS[n]||'')+'</svg>';}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return (v==null||isNaN(v))?'—':'¥'+Number(v).toFixed(2);}
function bytes(n){if(n==null)return '—';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';}
function rel(ms){if(!ms)return '—';const d=Date.now()-ms;if(d<0)return '刚刚';const s=Math.floor(d/1000);if(s<60)return s+'秒前';const m=Math.floor(s/60);if(m<60)return m+'分钟前';const h=Math.floor(m/60);if(h<24)return h+'小时前';return new Date(ms).toLocaleString('zh-CN',{hour12:false});}
function clock(ms){return new Date(ms||Date.now()).toLocaleString('zh-CN',{hour12:false});}
function uptime(sec){if(sec==null)return '—';const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return (d?d+'天':'')+(h?h+'小时':'')+m+'分钟';}
const ISTATUS={0:['已关机','p-muted'],4:['已关机','p-muted'],22:['已关机','p-muted'],23:['已关机','p-muted'],1:['开机中','p-warn'],24:['开机中','p-warn'],27:['开机中','p-warn'],2:['运行中','p-run'],3:['关机中','p-warn'],21:['关机中','p-warn'],error:['查询失败','p-err']};
function istatus(s){const v=ISTATUS[s]||['未知('+s+')','p-muted'];return '<span class="pill '+v[1]+'">'+v[0]+'</span>';}
const TSTATUS={succeeded:['成功','p-ok'],failed:['失败','p-err'],running:['进行中','p-run'],pending:['排队中','p-warn']};
function tstatus(s){const m=TSTATUS[s]||[s,'p-muted'];return '<span class="pill '+m[1]+'">'+m[0]+'</span>';}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2800);}
function emptyIc(){return '<div><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></div>';}

let TOKEN=localStorage.getItem('bridge_admin_token')||'';
function needAuth(){$('authMask').classList.add('show');setTimeout(()=>$('tokenInput').focus(),60);}
function saveToken(){TOKEN=$('tokenInput').value.trim();localStorage.setItem('bridge_admin_token',TOKEN);$('authMask').classList.remove('show');refresh();}
async function api(path,opts){opts=opts||{};const h=Object.assign({},opts.headers||{});if(TOKEN)h['x-admin-token']=TOKEN;if(opts.body)h['content-type']='application/json';
  const r=await fetch(path,Object.assign({},opts,{headers:h}));if(r.status===401){needAuth();throw new Error('需要管理口令');}
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,180));}return r.json();}

const S={view:'overview',data:{},tasks:[],gpus:[],models:[],workflows:[],sys:{},logs:[],taskFilter:'all',taskSearch:'',taskPage:1,logLevel:'all'};
const NAV=[['overview','概览','overview'],['instances','实例','instances'],['tasks','任务','tasks'],['workflows','工作流','models'],['gpus','GPU 资源','gpus'],['settings','设置','settings'],['logs','日志','logs'],['api','接入','api']];
const TITLES={overview:'概览',instances:'实例管理',tasks:'任务',workflows:'工作流',gpus:'GPU 资源',settings:'设置',logs:'运行日志',api:'接入文档'};
const SUBS={overview:'运行总览与账户状态',instances:'开机 / 关机 / 重启 / 详情',tasks:'生成任务 · 测试 · 重试 · 导出',workflows:'新增 / 编辑 / 上传工作流',gpus:'可用型号与价格',settings:'运行参数与系统诊断',logs:'进程内最近日志',api:'接口地址 · 调用示例 · 模型清单'};

function buildNav(){$('nav').innerHTML=NAV.map(([k,l,ic])=>'<a href="#/'+k+'" data-k="'+k+'">'+icon(ic)+'<span class="lbl">'+l+'</span></a>').join('');}
function setActive(){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===S.view));$('pageTitle').textContent=TITLES[S.view];$('pageSub').textContent=SUBS[S.view];}

async function refresh(){
  try{
    const [ov,tk,gp,wf,sy]=await Promise.all([
      api('/api/bridge/overview'),api('/api/bridge/tasks'),api('/api/bridge/gpus').catch(()=>({gpu_list:[]})),
      api('/api/bridge/workflows').catch(()=>({workflows:[]})),api('/api/bridge/system').catch(()=>({}))
    ]);
    S.data=ov;S.tasks=tk.tasks||[];S.gpus=(gp&&gp.gpu_list)||[];S.models=(ov.models||[]);S.workflows=(wf&&wf.workflows)||[];S.sys=sy||{};
    $('connDot').className='dot ok';$('connText').textContent='已连接';
    $('verText').textContent='v'+(ov.version||'')+' · Node '+(ov.node||'');
    $('lastUpdated').textContent='更新于 '+clock();
    if(S.view==='logs')await loadLogs();
    render();
  }catch(e){$('connDot').className='dot err';$('connText').textContent='连接失败';toast(e.message,true);}
}
async function loadLogs(){try{const r=await api('/api/bridge/logs?limit=400');S.logs=r.logs||[];}catch(e){}}
function render(){const c=$('content');
  if(S.view==='overview')c.innerHTML=viewOverview();
  else if(S.view==='instances')c.innerHTML=viewInstances();
  else if(S.view==='tasks')c.innerHTML=viewTasks();
  else if(S.view==='workflows')c.innerHTML=viewWorkflows();
  else if(S.view==='gpus')c.innerHTML=viewGpus();
  else if(S.view==='settings')c.innerHTML=viewSettings();
  else if(S.view==='logs')c.innerHTML=viewLogs();
  else if(S.view==='api')c.innerHTML=viewApi();
  bindView();
}
function kpi(label,val,sub,ic){return '<div class="kpi"><div class="ic">'+iconF(ic)+'</div><div class="k-label">'+label+'</div><div class="k-val">'+val+'</div><div class="k-sub">'+(sub||'')+'</div></div>';}

function viewOverview(){
  const d=S.data,a=d.account||{},st=d.taskStats||{},bh=d.budgetHistory||{},sett=d.settings||{};
  const budget=Number(a.dailyBudgetCny||sett.dailyBudgetCny||0),spent=Number(a.spendToday||0);
  const pct=budget>0?Math.min(100,Math.round(spent/budget*100)):0;
  const running=(d.instances||[]).filter(x=>x.status===2).length;
  const days=[];const now=new Date();
  for(let i=6;i>=0;i--){const dt=new Date(now.getTime()-i*86400000);const k=dt.toISOString().slice(0,10);days.push([k,Number(bh[k]||0)]);}
  const maxv=Math.max(0.01,...days.map(x=>x[1]));
  const bars=days.map(([k,v])=>'<div class="b"><div class="bar" style="height:'+Math.max(3,Math.round(v/maxv*100))+'%" title="'+k+' '+money(v)+'"></div><div class="lbl">'+k.slice(5)+'</div></div>').join('');
  const instRows=(d.instances||[]).length?d.instances.map(it=>'<tr><td style="font-weight:600">'+esc(it.gpuName||'—')+'</td><td>'+istatus(it.status)+'</td><td class="mono muted">'+esc((it.instanceId||'').slice(0,10))+'…</td></tr>').join(''):'<tr><td colspan="3" class="empty">无实例</td></tr>';
  const recent=S.tasks.slice(0,6);
  const recentRows=recent.length?recent.map(t=>'<tr><td class="muted">'+rel(t.createdAt)+'</td><td>'+esc(t.kind||'')+'</td><td>'+tstatus(t.status)+'</td><td class="mono muted">'+esc((t.id||'').slice(0,12))+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无任务</td></tr>';
  const needKey=!(S.sys&&S.sys.apiKeyConfigured);
  const banner=needKey?'<div class="sec card" style="border-color:var(--warn)"><div style="padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill p-warn">未配置晨羽 API Key</span><span class="muted">生成会失败，请先到「设置」填写晨羽 API Key。</span><a href="#/settings" style="margin-left:auto">去设置 ›</a></div></div>':'';
  return banner+'<div class="kpis">'+
    kpi('现金余额',money(a.balance),'低于阈值将拒绝开机','gpus')+
    kpi('代金券',money(a.card),'card balance','gpus')+
    kpi('今日花费',money(spent),'日预算 '+money(budget)+(sett.budgetEnabled===false?'（已关）':''),'tasks')+
    kpi('实例',(d.instances||[]).length+' <small style="font-size:13px;color:var(--muted)">个</small>',running?running+' 个运行中':'全部已关机','instances')+
  '</div>'+
  '<div class="grid2">'+
    '<div class="sec card"><div class="card-h"><h3>今日预算使用</h3><div class="right muted">'+pct+'%</div></div>'+
      '<div style="padding:18px"><div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:9px" class="muted"><span>已花 '+money(spent)+'</span><span>预算 '+money(budget)+'</span></div>'+
      '<div style="margin-top:20px;font-size:12px" class="muted">近 7 天花费</div><div class="bars">'+bars+'</div></div></div>'+
    '<div class="sec card"><div class="card-h"><h3>实例状态</h3><div class="right muted">成功 '+(st.succeeded||0)+' / 失败 '+(st.failed||0)+'</div></div><table><tbody>'+instRows+'</tbody></table></div>'+
  '</div>'+
  '<div class="sec card"><div class="card-h"><h3>最近任务</h3><div class="right"><a href="#/tasks" class="muted">查看全部 ›</a></div></div>'+
    '<table><thead><tr><th>时间</th><th>类型</th><th>状态</th><th>任务 ID</th></tr></thead><tbody>'+recentRows+'</tbody></table></div>';
}

function viewInstances(){
  const insts=S.data.instances||[];
  const rows=insts.length?insts.map(it=>{
    const run=it.status===2,stopped=[0,4,22,23].includes(it.status),busy=!run&&!stopped;
    return '<tr><td style="font-weight:600">'+esc(it.gpuName||'—')+'</td>'+
      '<td class="mono muted" title="'+esc(it.instanceId)+'">'+esc((it.instanceId||'').slice(0,14))+'…</td>'+
      '<td>'+istatus(it.status)+'</td>'+
      '<td><div style="display:flex;gap:7px;flex-wrap:wrap">'+
        '<button class="sm" data-act="startup" data-id="'+esc(it.instanceId)+'" '+(run||busy?'disabled':'')+'>开机</button>'+
        '<button class="sm danger" data-act="shutdown" data-id="'+esc(it.instanceId)+'" '+(run&&!busy?'':'disabled')+'>关机</button>'+
        '<button class="sm" data-restart="'+esc(it.instanceId)+'" '+(busy?'disabled':'')+'>重启</button>'+
        '<button class="sm ghost" data-detail="'+esc(it.instanceId)+'">详情</button>'+
      '</div></td></tr>';
  }).join(''):'<tr><td colspan="4" class="empty">'+emptyIc()+'当前没有已登记的实例；首次生成时会自动创建</td></tr>';
  return '<div class="toolbar"><span class="muted">共 '+(S.data.instances||[]).length+' 个实例 · 无排队时立即关机，兜底 '+(S.data.settings?S.data.settings.idleMinutes:'-')+' 分钟</span><div style="flex:1"></div><button class="sm danger" id="shutdownAll">全部关机</button></div>'+
    '<div class="sec card"><table><thead><tr><th>GPU 型号</th><th>实例 ID</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function modelOptions(){return (S.data.models||[]).slice();}
function viewTasks(){
  let list=S.tasks.slice();
  if(S.taskFilter!=='all')list=list.filter(t=>S.taskFilter==='running'?(t.status==='running'||t.status==='pending'):t.status===S.taskFilter);
  if(S.taskSearch){const q=S.taskSearch.toLowerCase();list=list.filter(t=>(t.id||'').toLowerCase().includes(q)||(t.kind||'').toLowerCase().includes(q)||(t.message||'').toLowerCase().includes(q)||(t.model||'').toLowerCase().includes(q));}
  const per=12,pages=Math.max(1,Math.ceil(list.length/per));if(S.taskPage>pages)S.taskPage=pages;
  const page=list.slice((S.taskPage-1)*per,S.taskPage*per);
  const rows=page.length?page.map(t=>{
    let res='—';
    if(t.url){res=/\.(png|jpg|jpeg|webp)(\?|$)/i.test(t.url)?'<a href="'+esc(t.url)+'" target="_blank"><img class="thumb" src="'+esc(t.url)+'" loading="lazy"/></a>':'<a href="'+esc(t.url)+'" target="_blank">打开</a>';}
    else if(t.message){res='<span class="muted" title="'+esc(t.message)+'">'+esc(t.message).slice(0,60)+'</span>';}
    const canRetry=t.status!=='running'&&t.status!=='pending'&&t.model&&t.params;
    const canCancel=(t.status==='running'||t.status==='pending')&&t.kind==='video';
    return '<tr><td class="muted" style="white-space:nowrap">'+clock(t.createdAt)+'</td><td>'+esc(t.kind||'—')+'</td><td>'+tstatus(t.status)+'</td><td class="mono muted">'+esc((t.id||'').slice(0,13))+'</td><td>'+res+'</td>'+
      '<td style="white-space:nowrap"><button class="sm ghost" data-tdetail="'+esc(t.id)+'">详情</button>'+(canRetry?'<button class="sm" data-tretry="'+esc(t.id)+'" style="margin-left:6px">重试</button>':'')+(canCancel?'<button class="sm danger" data-tcancel="'+esc(t.id)+'" style="margin-left:6px">取消</button>':'')+'</td></tr>';
  }).join(''):'<tr><td colspan="6" class="empty">'+emptyIc()+'没有符合条件的任务</td></tr>';
  const tabs=[['all','全部'],['running','进行中'],['succeeded','成功'],['failed','失败']].map(([k,l])=>'<button data-tf="'+k+'" class="'+(S.taskFilter===k?'active':'')+'">'+l+'</button>').join('');
  const pager=pages>1?'<div style="display:flex;gap:8px;align-items:center;padding:12px 16px" class="muted"><button class="sm" '+(S.taskPage<=1?'disabled':'')+' data-page="'+(S.taskPage-1)+'">上一页</button><span>'+S.taskPage+' / '+pages+'</span><button class="sm" '+(S.taskPage>=pages?'disabled':'')+' data-page="'+(S.taskPage+1)+'">下一页</button></div>':'';
  const mo=modelOptions();
  const opts=mo.length?mo.map(m=>'<option>'+esc(m)+'</option>').join(''):'<option>moss@4080</option>';
  return '<div class="sec card"><div class="card-h"><h3>测试生成</h3><div class="right muted">在管理端直接发起一条生成，验证链路/出图</div></div>'+
    '<div class="form"><div class="field" style="grid-column:1/-1"><label>提示词</label><textarea id="tgPrompt" placeholder="输入测试提示词，例如：一只柴犬，纯色背景"></textarea></div>'+
      '<div class="field"><label>模型</label><select id="tgModel">'+opts+'</select></div>'+
      '<div class="field"><label>比例</label><select id="tgRatio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>3:2</option><option>2:3</option><option>21:9</option></select></div>'+
      '<div class="field"><label>时长（视频，秒）</label><input id="tgDuration" type="number" value="6" min="1" max="30"/></div>'+
      '<div class="field"><label>画质档位（MP，可选）</label><input id="tgMp" type="number" step="0.5" placeholder="如 2.0"/></div>'+
      '<div class="form-actions"><span class="muted" id="tgHint"></span><button class="primary" id="tgRun">发起测试生成</button></div>'+
    '</div></div>'+
    '<div class="toolbar"><div class="tabs">'+tabs+'</div><input class="search" id="taskSearch" placeholder="搜索 任务ID / 类型 / 模型 / 消息" value="'+esc(S.taskSearch)+'"/><span class="muted">共 '+list.length+' 条</span><div style="flex:1"></div><button class="sm ghost" id="taskExport">导出</button><button class="sm danger" id="taskClear">清空历史</button></div>'+
    '<div class="sec card"><table><thead><tr><th>时间</th><th>类型</th><th>状态</th><th>任务 ID</th><th>结果</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'+pager+'</div>';
}

function wfModelIds(key){return (S.models||[]).filter(m=>m.indexOf(key+'@')===0);}
function viewWorkflows(){
  const cards=S.workflows.map(p=>{
    const chips=wfModelIds(p.key).map(m=>'<span class="chip">'+esc(m)+'<button data-copy="'+esc(m)+'" title="复制">⧉</button></span>').join('')||'<span class="muted">无</span>';
    const tag=p.builtin?'<span class="pill p-muted">内置</span>':(p.overridden?'<span class="pill p-run">已改</span>':'<span class="pill p-ok">自定义</span>');
    const wfBadge=p.workflowExists?'<span class="pill p-ok">存在</span>':'<span class="pill p-err">缺失</span>';
    return '<div class="sec card"><div class="card-h"><h3>'+esc(p.key)+' · '+esc(p.capability==='video'?'视频':'图片')+'</h3><div class="right">'+tag+'<span class="muted">默认 '+esc(p.defaultGpu)+'</span></div></div>'+
      '<div class="info-list">'+
        '<div class="r"><span>工作流文件</span><b class="mono">'+esc(p.workflowFile||'—')+' '+wfBadge+'</b></div>'+
        '<div class="r"><span>Pod UUID</span><b class="mono">'+esc((p.pod&&p.pod.uuid)||'—')+'</b></div>'+
        '<div class="r"><span>输出节点</span><b class="mono">'+esc(p.outputNode||'—')+' / '+esc(p.outputKind)+'</b></div>'+
        '<div><div class="muted" style="margin-bottom:8px;font-size:12px">可用模型</div><div class="chips">'+chips+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sm" data-wfedit="'+esc(p.key)+'">编辑</button><button class="sm ghost" data-wfupload="'+esc(p.key)+'">上传工作流</button><button class="sm ghost" data-wffile="'+esc(p.key)+'">查看文件</button><button class="sm danger" data-wfdel="'+esc(p.key)+'">删除</button></div>'+
      '</div></div>';
  }).join('');
  return '<div class="toolbar"><span class="muted">共 '+S.workflows.length+' 个工作流</span><div style="flex:1"></div><button class="primary" id="wfAdd">+ 新增工作流</button></div>'+
    '<div class="grid2">'+(cards||'<div class="empty">'+emptyIc()+'暂无工作流</div>')+'</div>';
}
function wfMappingTemplate(cap){return cap==='video'?{prompt:{node:'',input:'text'},duration:{node:'',input:'value',min:1,max:30},seed:{node:'',input:'seed'},aspect:{node:'',input:'aspect_ratio'},megapixels:{node:'',input:'megapixels',default:1.5},imageSlots:[],maxImages:9,maxVideos:3,maxAudios:3}:{prompt:{node:'',input:'value'},seed:{node:'',input:'seed'},aspect:{node:'',input:'aspect_ratio'},megapixels:{node:'',input:'megapixels',default:3},imageSlots:[]};}
function openWfEdit(key){
  const wf=key?S.workflows.find(x=>x.key===key):null;const isNew=!wf;
  const def=wf||{capability:'image',defaultGpu:'4080',outputNode:'',outputKind:'image',pod:{uuid:'',tag:''},mapping:wfMappingTemplate('image')};
  const cap=def.capability||'image';
  const html='<div class="form" style="padding:0">'+
    '<div class="field"><label>工作流 Key</label><input id="wfKey" value="'+esc(key||'')+'" '+(isNew?'':'disabled')+' placeholder="如 h3 / moss / myflow"/></div>'+
    '<div class="field"><label>类型</label><select id="wfCap" '+(isNew?'':'disabled')+'><option value="video" '+(cap==='video'?'selected':'')+'>视频</option><option value="image" '+(cap!=='video'?'selected':'')+'>图片</option></select></div>'+
    '<div class="field" style="grid-column:1/-1"><label>从晨羽 Pod 列表选择（可选，选后自动填 UUID/Tag）</label><select id="wfPodPick"><option value="">加载中…</option></select></div>'+
    '<div class="field"><label>Pod UUID</label><input id="wfPod" value="'+esc((def.pod&&def.pod.uuid)||'')+'"/></div>'+
    '<div class="field"><label>Pod Tag</label><input id="wfTag" value="'+esc((def.pod&&def.pod.tag)||'')+'"/></div>'+
    '<div class="field"><label>默认 GPU</label><input id="wfGpu" value="'+esc(def.defaultGpu||'4080')+'"/></div>'+
    '<div class="field"><label>输出节点</label><input id="wfOut" value="'+esc(def.outputNode||'')+'"/></div>'+
    '<div class="field"><label>输出类型</label><select id="wfKind"><option value="image" '+(def.outputKind==='image'?'selected':'')+'>图片</option><option value="video" '+(def.outputKind==='video'?'selected':'')+'>视频</option></select></div>'+
    '<div class="field"><label>工作流文件</label><input id="wfFile" value="'+esc(def.workflowFile||'')+'" placeholder="上传后自动填入"/></div>'+
    '<div class="field" style="grid-column:1/-1"><label>选择并上传工作流 JSON（.api.json）</label><input type="file" id="wfFilePick" accept=".json,application/json"/><div class="hint">选择后会自动解析输出节点与字段映射</div></div>'+
    '<div class="field" style="grid-column:1/-1"><div class="rowflex" style="justify-content:space-between"><label style="margin:0">字段映射 mapping（JSON，高级）</label><button class="sm" id="wfAnalyze" type="button">自动解析工作流</button></div><textarea id="wfMapping" style="min-height:150px">'+esc(JSON.stringify(def.mapping||wfMappingTemplate(cap),null,2))+'</textarea></div>'+
    '<div class="form-actions"><span class="muted" id="wfHint"></span><button class="primary" id="wfSave">'+(isNew?'创建工作流':'保存')+'</button></div></div>';
  showModal(isNew?'新增工作流':('编辑工作流 · '+key),html);
  api('/api/bridge/pods').then(r=>{const sel=$('wfPodPick');if(!sel)return;const pods=r.pods||[];sel.innerHTML='<option value="">— 手动填写 / 或选择 Pod —</option>'+pods.map(p=>'<option value="'+esc(p.uuid||'')+'" data-tag="'+esc((p.tags&&p.tags[0])||'')+'">'+esc(p.title||p.uuid||'')+' ('+esc(String(p.uuid||'').slice(0,8))+'…)</option>').join('');sel.onchange=()=>{const o=sel.selectedOptions[0];if(!o||!o.value)return;$('wfPod').value=o.value;if(o.dataset.tag&&!$('wfTag').value)$('wfTag').value=o.dataset.tag;};}).catch(()=>{const sel=$('wfPodPick');if(sel)sel.innerHTML='<option value="">（Pod 列表不可用，请手动填写）</option>';});
  $('wfFilePick').onchange=async()=>{const f=$('wfFilePick').files[0];if(!f)return;const text=await f.text();try{JSON.parse(text);}catch(e){toast('不是合法 JSON：'+e.message,true);return;}$('wfFile').value=f.name;$('wfFilePick')._content=text;$('wfHint').textContent='已选择 '+f.name+'，正在自动解析…';await autoAnalyze(text);};
  $('wfAnalyze').onclick=async()=>{let content=$('wfFilePick')._content;if(!content&&!isNew){try{const r=await api('/api/bridge/workflows/'+encodeURIComponent(key)+'/file');content=r.content;}catch(e){}}if(!content){toast('请先选择/上传工作流文件',true);return;}await autoAnalyze(content);};
  $('wfSave').onclick=()=>saveWf(isNew,key);
}
async function autoAnalyze(content){
  try{
    const r=await api('/api/bridge/workflows/analyze',{method:'POST',body:JSON.stringify({content})});
    const a=r.analysis;if(!a)return;
    if(a.outputNode)$('wfOut').value=a.outputNode;
    if(a.outputKind)$('wfKind').value=a.outputKind;
    if(a.mapping)$('wfMapping').value=JSON.stringify(a.mapping,null,2);
    const msg=(a.notes||[]).join('；')+(a.warnings&&a.warnings.length?('；⚠ '+(a.warnings).join('；')):'');
    const h=$('wfHint');if(h)h.textContent='已自动解析：'+msg;
    toast('已自动解析工作流字段');
  }catch(e){toast('自动解析失败：'+e.message,true);}
}
async function saveWf(isNew,key){
  const hint=$('wfHint');const kk=(isNew?($('wfKey').value||'').trim():key);
  if(!kk){toast('请填写 Key',true);return;}
  let mapping;try{mapping=JSON.parse($('wfMapping').value||'{}');}catch(e){toast('mapping 不是合法 JSON：'+e.message,true);return;}
  const def={capability:$('wfCap').value,pod:{uuid:($('wfPod').value||'').trim(),tag:($('wfTag').value||'').trim()},defaultGpu:($('wfGpu').value||'').trim(),workflowFile:($('wfFile').value||'').trim(),outputNode:($('wfOut').value||'').trim(),outputKind:$('wfKind').value,mapping};
  hint.textContent='保存中…';
  try{
    const pick=$('wfFilePick');const content=pick&&pick._content;
    if(content){const filename=def.workflowFile||pick.files[0].name;const up=await api('/api/bridge/workflows/'+encodeURIComponent(kk)+'/upload',{method:'POST',body:JSON.stringify({filename,content})});def.workflowFile=up.filename;}
    if(isNew)await api('/api/bridge/workflows',{method:'POST',body:JSON.stringify(Object.assign({key:kk},def))});
    else await api('/api/bridge/workflows/'+encodeURIComponent(kk),{method:'PUT',body:JSON.stringify(def)});
    toast('已保存');$('mask').classList.remove('show');setTimeout(refresh,600);
  }catch(e){hint.textContent='';toast('保存失败：'+e.message,true);}
}
function openWfUpload(key){
  const wf=S.workflows.find(x=>x.key===key)||{};
  const m=$('modal');m.className='modal wide';
  m.innerHTML='<h3>上传工作流 · '+esc(key)+'</h3>'+
    '<div class="field"><label>选择 .api.json 文件</label><input type="file" id="upFile" accept=".json,application/json"/></div>'+
    '<div class="field" style="margin-top:12px"><label>或粘贴工作流 JSON</label><textarea id="upText" style="min-height:150px" placeholder="{ ... }"></textarea></div>'+
    '<div class="muted" id="upHint" style="margin-top:10px"></div>'+
    '<div class="acts"><button class="ghost" id="upCancel">取消</button><button class="primary" id="upDo">上传</button></div>';
  $('mask').classList.add('show');
  $('upFile').onchange=async()=>{const f=$('upFile').files[0];if(f){$('upText').value=await f.text();$('upHint').textContent='已读取 '+f.name;}};
  $('upCancel').onclick=()=>$('mask').classList.remove('show');
  $('upDo').onclick=async()=>{const content=$('upText').value.trim();if(!content){toast('请选择文件或粘贴 JSON',true);return;}const fn=$('upFile').files[0]?$('upFile').files[0].name:(wf.workflowFile||key+'.api.json');try{const r=await api('/api/bridge/workflows/'+encodeURIComponent(key)+'/upload',{method:'POST',body:JSON.stringify({filename:fn,content})});toast('已上传 '+r.filename);$('mask').classList.remove('show');setTimeout(refresh,600);}catch(e){toast('上传失败：'+e.message,true);}};
}
async function openWfFile(key){try{const r=await api('/api/bridge/workflows/'+encodeURIComponent(key)+'/file');showModal('工作流文件 · '+r.filename,'<pre>'+esc(String(r.content).slice(0,20000))+'</pre>');}catch(e){toast('读取失败：'+e.message,true);}}
async function deleteWf(key){confirmModal('删除工作流？','将删除工作流「'+key+'」。上传的工作流文件仍保留在 data/workflows。',async()=>{try{await api('/api/bridge/workflows/'+encodeURIComponent(key),{method:'DELETE'});toast('已删除');refresh();}catch(e){toast('删除失败：'+e.message,true);}});}

function viewGpus(){
  const cards=S.gpus.length?S.gpus.map(g=>{
    const p=g.price||{};const price=p.hour!=null?p.hour:null;
    return '<div class="gpu"><div class="name"><span>'+esc(g.gpu_name)+'</span><span class="pill p-muted" style="font-size:10.5px">状态 '+esc(g.status)+'</span></div>'+
      '<div class="price">'+(price!=null?'¥'+Number(price).toFixed(2):'—')+'<small> /小时</small></div>'+
      '<div class="meta">日 '+(p.day!=null?'¥'+Number(p.day).toFixed(0):'—')+' · 周 '+(p.week!=null?'¥'+Number(p.week).toFixed(0):'—')+' · 月 '+(p.month!=null?'¥'+Number(p.month).toFixed(0):'—')+'</div></div>';
  }).join(''):'<div class="empty">'+emptyIc()+'无 GPU 数据（请检查 CHENYU_API_KEY）</div>';
  return '<div class="sec card"><div class="card-h"><h3>GPU 资源与价格</h3><div class="right"><button class="sm ghost" onclick="refresh()">刷新</button></div></div><div style="padding:16px"><div class="gpus">'+cards+'</div></div></div>';
}

function viewSettings(){
  const d=S.data,s=d.settings||{},sy=S.sys||{};
  const mem=sy.memory||{};
  return '<div class="grid2">'+
    '<div class="card"><div class="card-h"><h3>运行参数</h3></div><div class="form">'+
      numField('idleMinutes','空闲兜底关机（分钟）',s.idleMinutes,'正常“无排队”立即关机；此项仅在关机失败/队列异常时兜底')+
      numField('dailyBudgetCny','每日预算（元，0=不限）',s.dailyBudgetCny,'超过预算拒绝新任务')+
      numField('minBalance','最低现金余额（元）',s.minBalance,'低于该值拒绝开机')+
      numField('priceFallbackCny','价格兜底（元/小时）',s.priceFallbackCny,'取不到 GPU 单价时的估算值')+
      '<div class="field" style="grid-column:1/-1"><label>晨羽 API Key（必需）</label><input type="password" id="f_chenyuApiKey" placeholder="'+(s.hasChenyuApiKey?'已配置，留空则不变':'未配置，请填写晨羽 API Key')+'"/><div class="hint">在「晨羽智云」个人中心获取；留空不修改，输入 - 表示清除。仅保存在服务端。</div></div>'+
      '<div class="field"><label>预算保护</label><div class="rowflex"><label class="toggle"><input type="checkbox" id="f_budgetEnabled" '+(s.budgetEnabled!==false?'checked':'')+'/><span class="sl"></span></label><span class="muted" style="font-size:12px">开启后按每日预算拦截</span></div></div>'+
      '<div class="field"><label>管理口令</label><input type="password" id="f_adminToken" placeholder="'+(s.hasAdminToken?'已设置，留空则不变':'未设置')+'"/><div class="hint">设置后 /api/bridge/* 需口令；留空不修改，输入 - 表示清除</div></div>'+
      '<div class="form-actions"><span class="muted" id="saveHint"></span><button class="primary" id="saveSettings">保存设置</button></div>'+
    '</div></div>'+
    '<div class="card"><div class="card-h"><h3>系统诊断</h3></div><div class="info-list">'+
      info('版本','v'+esc(sy.version||d.version||'—'))+
      info('运行时长',uptime(sy.uptimeSec))+
      info('Node / 平台',esc((sy.node||'')+' · '+(sy.platform||'')+'/'+(sy.arch||'')))+
      info('内存 RSS',bytes(mem.rss))+
      info('堆内存',bytes(mem.heapUsed)+' / '+bytes(mem.heapTotal))+
      info('产物数量',(sy.filesCount!=null?sy.filesCount:'—')+' 个 / '+bytes(sy.filesBytes))+
      info('上游 API',esc(sy.apiBase||d.apiBase||'—'))+
      info('API Key',sy.apiKeyConfigured?'<span class="pill p-ok">已配置</span>':'<span class="pill p-err">未配置</span>')+
      info('管理口令',sy.adminTokenSet?'<span class="pill p-ok">已开启</span>':'<span class="pill p-warn">未设置(开放)</span>')+
      '<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap"><button class="sm" id="pruneBtn">清理过期产物(7天)</button><button class="sm ghost" id="clearLogsBtn">清空日志</button></div>'+
    '</div></div></div>';
}
function numField(n,label,val,hint){return '<div class="field"><label>'+label+'</label><input type="number" step="0.1" id="f_'+n+'" value="'+(val==null?'':val)+'"/><div class="hint">'+hint+'</div></div>';}
function info(k,v){return '<div class="r"><span>'+k+'</span><b>'+v+'</b></div>';}

function viewLogs(){
  const logs=S.logs.filter(l=>S.logLevel==='all'||l.level===S.logLevel);
  const rows=logs.length?logs.map(l=>'<div class="logline"><span class="tm">'+clock(l.t)+'</span><span class="lv '+l.level+'">'+l.level.toUpperCase()+'</span><span>'+esc(l.msg)+'</span></div>').join(''):'<div class="empty">'+emptyIc()+'暂无日志</div>';
  const tabs=[['all','全部'],['info','INFO'],['warn','WARN'],['error','ERROR']].map(([k,l])=>'<button data-lf="'+k+'" class="'+(S.logLevel===k?'active':'')+'">'+l+'</button>').join('');
  return '<div class="toolbar"><div class="tabs">'+tabs+'</div><span class="muted">最近 '+logs.length+' 条（进程内，另持久化到 data/bridge.log）</span><div style="flex:1"></div><button class="sm ghost" id="dlLogs">下载日志</button><button class="sm ghost" id="clearLogsBtn2">清空</button></div>'+
    '<div class="sec card"><div class="logbox">'+rows+'</div></div>';
}

function row(path,method,desc){return '<tr><td class="mono">'+esc(path)+'</td><td><span class="pill p-muted">'+esc(method)+'</span></td><td class="muted">'+esc(desc)+'</td></tr>';}
function viewApi(){
  const base=(S.data.publicBase||location.origin).replace(/\/$/,'');
  const models=(S.models||[]);
  const imgModel=(models.find(m=>m.startsWith('moss'))||models[0]||'moss@4080');
  const vidModel=(models.find(m=>m.startsWith('h3'))||'h3@4080');
  const curlImg='curl -s '+base+'/v1/images/generations -H "content-type: application/json" -d \'{"model":"'+imgModel+'","prompt":"一只柴犬，纯色背景","aspect_ratio":"16:9","megapixels":3}\'';
  const curlVid='curl -s '+base+'/v1/videos -H "content-type: application/json" -d \'{"model":"'+vidModel+'","input":{"prompt":"镜头缓慢推进"},"parameters":{"ratio":"16:9","duration":6}}\'';
  const chips=models.map(m=>'<span class="chip">'+esc(m)+'<button data-copy="'+esc(m)+'" title="复制">⧉</button></span>').join('')||'<span class="muted">暂无模型（请先在「工作流」新增）</span>';
  return '<div class="sec card"><div class="card-h"><h3>接入信息</h3><div class="right muted">把地址给到任意客户端 / 影策</div></div><div class="info-list">'+
      info('服务地址',esc(base))+
      info('管理后台',esc(base+'/admin'))+
      info('鉴权','<span class="muted">业务接口无需鉴权；仅 /api/bridge/* 受管理口令保护</span>')+
    '</div></div>'+
    '<div class="sec card"><div class="card-h"><h3>接口一览</h3></div><table><thead><tr><th>接口</th><th>方法</th><th>说明</th></tr></thead><tbody>'+
      row(base+'/v1/models','GET','列出可用模型（预设@GPU）')+
      row(base+'/v1/images/generations','POST','图片生成（OpenAI Images 兼容，返回 data[].url）')+
      row(base+'/v1/videos','POST','提交视频任务（异步，返回 id）')+
      row(base+'/v1/videos/{id}','GET','查询视频任务（status / video_url）')+
      row(base+'/files/{name}','GET','获取产物文件')+
      row(base+'/healthz','GET','健康检查')+
    '</tbody></table></div>'+
    '<div class="sec card"><div class="card-h"><h3>调用示例</h3></div><div style="padding:16px">'+
      '<div class="muted" style="margin-bottom:6px">图片</div><pre>'+esc(curlImg)+'</pre>'+
      '<div class="muted" style="margin:14px 0 6px">视频（异步）</div><pre>'+esc(curlVid)+'</pre></div></div>'+
    '<div class="sec card"><div class="card-h"><h3>可用模型</h3><div class="right"><button class="sm" data-copy="'+esc(models.join('\n'))+'">复制全部</button></div></div><div style="padding:16px"><div class="chips">'+chips+'</div></div></div>';
}

function bindView(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>instanceAct(b.dataset.id,b.dataset.act));
  document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>restartInstance(b.dataset.restart));
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>instanceDetail(b.dataset.detail));
  const sa=$('shutdownAll');if(sa)sa.onclick=shutdownAll;
  document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{S.taskFilter=b.dataset.tf;S.taskPage=1;render();});
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.taskPage=Number(b.dataset.page);render();});
  document.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{S.logLevel=b.dataset.lf;render();});
  document.querySelectorAll('[data-tdetail]').forEach(b=>b.onclick=()=>taskDetail(b.dataset.tdetail));
  document.querySelectorAll('[data-tretry]').forEach(b=>b.onclick=()=>taskRetry(b.dataset.tretry));
  document.querySelectorAll('[data-tcancel]').forEach(b=>b.onclick=()=>taskCancel(b.dataset.tcancel));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);toast('已复制 '+b.dataset.copy);});
  document.querySelectorAll('[data-wfedit]').forEach(b=>b.onclick=()=>openWfEdit(b.dataset.wfedit));
  document.querySelectorAll('[data-wfupload]').forEach(b=>b.onclick=()=>openWfUpload(b.dataset.wfupload));
  document.querySelectorAll('[data-wffile]').forEach(b=>b.onclick=()=>openWfFile(b.dataset.wffile));
  document.querySelectorAll('[data-wfdel]').forEach(b=>b.onclick=()=>deleteWf(b.dataset.wfdel));
  const wfAddBtn=$('wfAdd');if(wfAddBtn)wfAddBtn.onclick=()=>openWfEdit(null);
  const ts=$('taskSearch');if(ts)ts.oninput=()=>{S.taskSearch=ts.value;S.taskPage=1;const v=ts.value;render();const t2=$('taskSearch');if(t2){t2.value=v;t2.focus();t2.selectionStart=t2.selectionEnd=v.length;}};
  const tg=$('tgRun');if(tg)tg.onclick=testGenerate;
  const te=$('taskExport');if(te)te.onclick=exportTasks;
  const tc=$('taskClear');if(tc)tc.onclick=clearTasks;
  const sv=$('saveSettings');if(sv)sv.onclick=saveSettings;
  const pb=$('pruneBtn');if(pb)pb.onclick=()=>actSimple('清理过期产物','将删除 7 天前的产物文件','/api/bridge/prune','removed');
  const cl=$('clearLogsBtn');if(cl)cl.onclick=()=>actSimple('清空日志','将清空进程内日志缓冲','/api/bridge/logs/clear');
  const cl2=$('clearLogsBtn2');if(cl2)cl2.onclick=()=>actSimple('清空日志','将清空进程内日志缓冲','/api/bridge/logs/clear');
  const dl=$('dlLogs');if(dl)dl.onclick=downloadLogs;
}

async function instanceAct(id,action){if(!id)return;const label=action==='startup'?'开机':'关机';
  confirmModal(label+'实例？','将对实例 '+id.slice(0,12)+'… 执行「'+label+'」。',async()=>{
    try{await api('/api/bridge/instances/'+encodeURIComponent(id)+'/'+action,{method:'POST'});toast(label+'指令已发送');}catch(e){toast(label+'失败：'+e.message,true);}
    setTimeout(refresh,1500);
  });
}
async function restartInstance(id){confirmModal('重启实例？','将先关机再开机实例 '+id.slice(0,12)+'…（会中断当前任务）',async()=>{
  try{await api('/api/bridge/instances/'+encodeURIComponent(id)+'/shutdown',{method:'POST'});toast('已关机，等待重启…');
    setTimeout(async()=>{try{await api('/api/bridge/instances/'+encodeURIComponent(id)+'/startup',{method:'POST'});toast('已发送开机');}catch(e){toast('开机失败：'+e.message,true);}setTimeout(refresh,1500);}, 4000);
  }catch(e){toast('关机失败：'+e.message,true);}
});}
async function shutdownAll(){confirmModal('全部关机？','将关闭所有“运行中”的实例，停止计费。',async()=>{
  try{const r=await api('/api/bridge/instances/shutdown-all',{method:'POST'});toast('已关机 '+(r.results||[]).filter(x=>x.ok).length+' 个');}catch(e){toast('失败：'+e.message,true);}
  setTimeout(refresh,1500);
});}
async function instanceDetail(id){try{
  const r=await api('/api/bridge/instances/'+encodeURIComponent(id));
  showModal('实例详情','<div class="kv"><span class="k">实例 ID</span><span class="mono">'+esc(id)+'</span>'+
    '<span class="k">GPU</span><span>'+esc(r.gpuName||'—')+'</span>'+
    '<span class="k">状态</span><span>'+istatus(r.status)+'</span>'+
    '<span class="k">ComfyUI 地址</span><span class="mono">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank">'+esc(r.url)+'</a>':'—')+'</span></div>');
 }catch(e){toast('查询失败：'+e.message,true);}}

function taskDetail(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const params=t.params?JSON.stringify(t.params,null,2):'—';
  let html='<div class="kv"><span class="k">任务 ID</span><span class="mono">'+esc(t.id)+'</span>'+
    '<span class="k">状态</span><span>'+tstatus(t.status)+'</span>'+
    '<span class="k">类型</span><span>'+esc(t.kind||'—')+'</span>'+
    '<span class="k">模型</span><span class="mono">'+esc(t.model||'—')+'</span>'+
    '<span class="k">创建时间</span><span>'+clock(t.createdAt)+'</span>'+
    '<span class="k">耗时</span><span>'+(t.updatedAt&&t.createdAt?Math.round((t.updatedAt-t.createdAt)/1000)+' 秒':'—')+'</span>'+
    '<span class="k">结果</span><span>'+(t.url?'<a href="'+esc(t.url)+'" target="_blank">'+esc(t.url)+'</a>':'—')+'</span>'+
    '<span class="k">消息</span><span>'+esc(t.message||'—')+'</span></div>'+
    '<div class="muted" style="margin:14px 0 6px;font-size:12px">请求参数</div><pre>'+esc(params)+'</pre>';
  showModal('任务详情',html);
}
async function taskRetry(id){try{const r=await api('/api/bridge/tasks/'+encodeURIComponent(id)+'/retry',{method:'POST'});toast('已重新提交：'+r.id);setTimeout(refresh,1200);}catch(e){toast('重试失败：'+e.message,true);}}
async function taskCancel(id){confirmModal('取消任务？','将取消任务 '+String(id).slice(0,10)+'… 并尝试关闭实例以停止计费。',async()=>{try{await api('/v1/videos/'+encodeURIComponent(id)+'/cancel',{method:'POST'});toast('已取消');setTimeout(refresh,1200);}catch(e){toast('取消失败：'+e.message,true);}});}
async function downloadLogs(){try{const h=TOKEN?{'x-admin-token':TOKEN}:{};const r=await fetch('/api/bridge/logs/download',{headers:h});if(!r.ok)throw new Error((await r.text()).slice(0,120));const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bridge.log';a.click();URL.revokeObjectURL(a.href);}catch(e){toast('下载失败：'+e.message,true);}}
async function clearTasks(){confirmModal('清空历史任务？','将删除所有已结束的任务记录（进行中的保留）。',async()=>{
  try{const r=await api('/api/bridge/tasks/clear',{method:'POST'});toast('已清理 '+r.removed+' 条');refresh();}catch(e){toast('失败：'+e.message,true);}
});}
function exportTasks(){const blob=new Blob([JSON.stringify(S.tasks,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chenyu-tasks-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';a.click();URL.revokeObjectURL(a.href);}
async function testGenerate(){const hint=$('tgHint');const model=$('tgModel').value;const prompt=$('tgPrompt').value.trim();
  if(!prompt){toast('请填写提示词',true);return;}
  const body={model,prompt,ratio:$('tgRatio').value,duration:Number($('tgDuration').value),megapixels:$('tgMp').value?Number($('tgMp').value):undefined};
  hint.textContent='提交中…';const btn=$('tgRun');btn.disabled=true;
  try{const r=await api('/api/bridge/test',{method:'POST',body:JSON.stringify(body)});hint.textContent='已提交 '+r.id;toast('测试任务已提交');$('tgPrompt').value='';setTimeout(refresh,1200);}
  catch(e){hint.textContent='';toast('提交失败：'+e.message,true);}btn.disabled=false;
}
async function saveSettings(){
  const btn=$('saveSettings');btn.disabled=true;const hint=$('saveHint');if(hint)hint.textContent='保存中…';
  const body={idleMinutes:Number($('f_idleMinutes').value),dailyBudgetCny:Number($('f_dailyBudgetCny').value),minBalance:Number($('f_minBalance').value),priceFallbackCny:Number($('f_priceFallbackCny').value),budgetEnabled:$('f_budgetEnabled').checked};
  const tk=$('f_adminToken').value; if(tk!==''){ body.adminToken = tk==='-' ? '' : tk; }
  const ak=$('f_chenyuApiKey'); if(ak && ak.value!==''){ body.chenyuApiKey = ak.value; }
  try{await api('/api/bridge/settings',{method:'PUT',body:JSON.stringify(body)});if(hint)hint.textContent='已保存';toast('设置已保存');setTimeout(refresh,800);}
  catch(e){if(hint)hint.textContent='';toast('保存失败：'+e.message,true);}btn.disabled=false;
}
async function actSimple(title,desc,path){confirmModal(title,desc,async()=>{try{const r=await api(path,{method:'POST'});toast('完成'+(r&&r.removed!=null?'：'+r.removed:'')+' 条');refresh();}catch(e){toast('失败：'+e.message,true);}});}

function showModal(title,bodyHtml,onOk){const m=$('modal');m.className='modal wide';m.innerHTML='<h3>'+esc(title)+'</h3>'+bodyHtml+'<div class="acts"><button class="ghost" id="mClose">关闭</button>'+(onOk?'<button class="primary" id="mOk2">确定</button>':'')+'</div>';
  $('mask').classList.add('show');$('mClose').onclick=()=>{$('mask').classList.remove('show');};if(onOk)$('mOk2').onclick=()=>{$('mask').classList.remove('show');onOk();};}
function confirmModal(title,desc,onOk){const m=$('modal');m.className='modal';m.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p><div class="acts"><button class="ghost" id="mCancel">取消</button><button class="primary" id="mOk">确定</button></div>';
  $('mask').classList.add('show');$('mCancel').onclick=()=>$('mask').classList.remove('show');$('mOk').onclick=()=>{$('mask').classList.remove('show');onOk&&onOk();};}

function route(){const k=(location.hash||'#/overview').replace(/^#\//,'').split('/')[0];S.view=TITLES[k]?k:'overview';setActive();render();}
window.addEventListener('hashchange',()=>{route();refresh();});
$('btnRefresh').onclick=()=>refresh();
$('auto').addEventListener('change',()=>startAuto());
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('bridge_theme',t);}
$('btnTheme').onclick=()=>{const cur=document.documentElement.dataset.theme==='light'?'dark':'light';applyTheme(cur);};
let timer=null;function startAuto(){if(timer)clearInterval(timer);timer=null;if($('auto').checked)timer=setInterval(()=>refresh(),5000);}
applyTheme(localStorage.getItem('bridge_theme')||'dark');
buildNav();setActive();route();refresh();startAuto();
</script>
</body>
</html>
